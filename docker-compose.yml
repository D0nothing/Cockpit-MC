services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: vistory
      POSTGRES_PASSWORD: vistory
      POSTGRES_DB: vistory
    ports:
      - "5432:5432"
    volumes:
      - vistory-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vistory"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  vistory-postgres:

