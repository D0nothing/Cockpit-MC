name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: vistory, POSTGRES_PASSWORD: vistory, POSTGRES_DB: vistory }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U vistory" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://vistory:vistory@localhost:5432/vistory?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run build

