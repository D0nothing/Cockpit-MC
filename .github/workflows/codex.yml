name: Codex proposal

on:
  workflow_dispatch:
    inputs:
      ticket_id: { description: Legacy internal ticket identifier, required: false, type: string }
      dispatch_id: { description: Governed task dispatch identifier, required: false, type: string }
      branch_name: { description: Dedicated proposal branch, required: true, type: string }

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    if: startsWith(inputs.branch_name, 'codex/')
    runs-on: ubuntu-latest
    steps:
      - name: Validate bounded input
        shell: bash
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |
          if [[ -n "$TICKET_ID" && -n "$DISPATCH_ID" ]]; then
            echo "Exactly one context identifier is allowed" >&2
            exit 1
          fi
          if [[ -z "$TICKET_ID" && -z "$DISPATCH_ID" ]]; then
            echo "A context identifier is required" >&2
            exit 1
          fi
          if [[ ! "$BRANCH_NAME" =~ ^codex/[A-Za-z0-9._/-]{1,90}$ ]] || \
             [[ "$BRANCH_NAME" == *..* ]] || [[ "$BRANCH_NAME" == *//* ]] || \
             ! git check-ref-format "refs/heads/$BRANCH_NAME"; then
            echo "Invalid proposal branch" >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: npm }
      - name: Create dedicated branch
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
        run: git switch -c "$BRANCH_NAME"
      - name: Fetch validated and sanitized context
        env:
          COCKPIT_URL: ${{ secrets.COCKPIT_URL }}
          COCKPIT_WORKER_TOKEN: ${{ secrets.COCKPIT_WORKER_TOKEN }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          TICKET_ID: ${{ inputs.ticket_id }}
        run: |
          test -n "$COCKPIT_URL" && test -n "$COCKPIT_WORKER_TOKEN"
          if [[ -n "$DISPATCH_ID" ]]; then
            context_path="dispatches/$DISPATCH_ID/context"
          else
            context_path="tickets/$TICKET_ID/context"
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $COCKPIT_WORKER_TOKEN" \
            "$COCKPIT_URL/api/worker/$context_path" > /tmp/codex-context.json
      - name: Run Codex
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npm install --global @openai/codex@0.147.0
          jq -r '.prompt' /tmp/codex-context.json | codex exec --full-auto -
      - name: Test proposal
        run: npm ci && npm run lint && npm test && npm run build
      - name: Commit proposal
        id: proposal
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "software-factory-codex[bot]"
          git config user.email "software-factory-codex[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "feat: propose bounded Vistory task"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --set-upstream origin "$BRANCH_NAME"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Open draft pull request
        id: pull_request
        env:
          BRANCH_NAME: ${{ inputs.branch_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url=$(gh pr create --draft --title "Vistory OS · proposition bornée" --body "Proposition générée depuis une spécification validée. La revue et la fusion restent entièrement humaines." || gh pr view "$BRANCH_NAME" --json url --jq .url)
          echo "url=$pr_url" >> "$GITHUB_OUTPUT"
      - name: Report governed result
        if: success() && inputs.dispatch_id != ''
        env:
          COCKPIT_URL: ${{ secrets.COCKPIT_URL }}
          COCKPIT_WORKER_TOKEN: ${{ secrets.COCKPIT_WORKER_TOKEN }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
          COMMIT_SHA: ${{ steps.proposal.outputs.commit_sha }}
          PR_URL: ${{ steps.pull_request.outputs.url }}
        run: |
          content_hash=$(printf '%s' "$COMMIT_SHA" | sha256sum | cut -d' ' -f1)
          jq -n \
            --arg report "Tests, build, commit et brouillon de pull request terminés. PR: $PR_URL" \
            --arg uri "https://github.com/${GITHUB_REPOSITORY}/commit/$COMMIT_SHA" \
            --arg hash "$content_hash" \
            '{state:"completed",report:$report,artifacts:[{kind:"commit",uri:$uri,mediaType:"text/plain",contentHash:$hash}]}' \
            > /tmp/codex-result.json
          curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $COCKPIT_WORKER_TOKEN" -H "Content-Type: application/json" \
            --data-binary @/tmp/codex-result.json \
            "$COCKPIT_URL/api/worker/dispatches/$DISPATCH_ID/results"
      - name: Report failure
        if: failure() && inputs.dispatch_id != ''
        continue-on-error: true
        env:
          COCKPIT_URL: ${{ secrets.COCKPIT_URL }}
          COCKPIT_WORKER_TOKEN: ${{ secrets.COCKPIT_WORKER_TOKEN }}
          DISPATCH_ID: ${{ inputs.dispatch_id }}
        run: |
          jq -n '{state:"failed",report:"The bounded development workflow failed. Inspect the GitHub Actions run.",error:"workflow_failed",artifacts:[]}' > /tmp/codex-failure.json
          curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $COCKPIT_WORKER_TOKEN" -H "Content-Type: application/json" \
            --data-binary @/tmp/codex-failure.json \
            "$COCKPIT_URL/api/worker/dispatches/$DISPATCH_ID/results"
